submission:
  title: "codewarrior AI — Autonomous Supply Chain Disruption & Cold-Chain Resiliency Copilot"                            # REQUIRED — Project display name, e.g., "SmartOps Dashboard"

  problem_statement: >                 # REQUIRED — 1-3 sentences. What problem? Who has it?
    Supply chain disruptions — weather events, port strikes, geopolitical crises — cascade 
    across hundreds of active shipments in ways that are impossible to track manually. Fleet
    assets (trucks, containers, vessels) sit idle while other routes are overloaded. Cold chain
    shipments (vaccines, perishables) are especially vulnerable — a single temperature
    excursion across any leg can spoil a $500K+ cargo, but breaches are only discovered at
    delivery when it is too late.

  solution_summary: >                  # REQUIRED — 1-3 sentences. What did you build?
     codewarrior AI is an autonomous resilience copilot built with IBM Bob and watsonx.ai that actively monitors in-transit
     IoT cold-chain telemetry and disruption feeds. It computes FDA/WHO Mean Kinetic Temperature (MKT) degradation in real time,
     predicts time-to-spoilage, locates nearby idle refrigerated fleet assets, and autonomously executes emergency rescue
     reroutes to prevent catastrophic cargo loss.

  key_features:                        # REQUIRED — List 3 to 5 specific features you implemented
    - "Real-time IoT Cold-Chain Monitoring with automated FDA/WHO Mean Kinetic Temperature (MKT) degradation math"                               # e.g., "Real-time pipeline anomaly detection using watsonx.ai"
    - "Geospatial Disruption Intersect Engine cross-referencing active shipment routes with weather hazard polygons"
    - "Autonomous Fleet Asset Rebalancing identifying and dispatching idle refrigerated trailers (reefers)"
    - "Load-bearing IBM Bob MCP integration enabling natural-language crisis diagnosis and 1-click rescue runbook execution"                               # optional 4th
    - "Audit-ready regulatory excursion and spoilage risk reporting for pharmaceutical quality assurance"                               # optional 5th

  tech_stack:
    languages: ["Python", "TypeScript", "JavaScript"]                      # REQUIRED — e.g., ["Python", "TypeScript"]
    frameworks: ["FastAPI", "React", "TailwindCSS"]                     # e.g., ["FastAPI", "React"]
    ibm_technologies: ["IBM Bob", "watsonx.ai", "Granite 3.0", "Model Context Protocol (MCP)"]               # e.g., ["watsonx.ai", "IBM Bob", "IBM Cloud Functions"]
    databases: ["SQLite", "In-Memory Telemetry Cache"]                      # e.g., ["PostgreSQL", "Redis"]
    other: ["FastMCP", "GitHub Actions", "Leaflet GeoJSON"]                          # e.g., ["Docker", "GitHub Actions", "Slack API"]

  what_we_are_most_proud_of: >         # Optional but recommended — guides judges to your best work
    We are most proud of making IBM Bob truly load-bearing as an autonomous operational agent rather than just a chatbot.
    Through custom MCP tools, Bob doesn't just read logs—Bob calculates real biopharmaceutical thermal physics (MKT),
    detects an active blizzard crisis on Interstate 80, finds an idle refrigerated truck 14 miles away, and issues
    a live emergency rescue divert order that saves $520,000 worth of pediatric vaccines before they spoil.

  known_limitations: >                 # Optional but recommended — be honest about gaps
    IoT sensor feeds and weather blizzard polygons are simulated via high-fidelity
    JSON streams rather than live physical truck hardware and NOAA radar APIs. Fleet redeployment is demonstrated across
    regional logistics hubs rather than a full nationwide carrier network.


